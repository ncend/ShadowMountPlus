name: Auto Sync and Build

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add Upstream Remote
        run: |
          git remote add upstream https://github.com/drakmor/ShadowMountPlus.git || true
          git fetch upstream --tags

      - name: Get Latest Upstream Tag
        id: upstream_tag
        run: |
          LATEST=$(git ls-remote --tags upstream | awk '{print $2}' | sed 's|refs/tags/||' | grep -E '^[0-9]+\.' | sort -V | tail -1)
          echo "latest_tag=$LATEST" >> $GITHUB_OUTPUT
          echo "Latest upstream tag: $LATEST"

      - name: Check if -nc tag already exists
        id: nc_tag_check
        run: |
          NC_TAG="${{ steps.upstream_tag.outputs.latest_tag }}-nc"
          if git rev-parse "$NC_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag $NC_TAG already exists locally"
          elif git ls-remote --tags origin | grep -q "refs/tags/$NC_TAG$"; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag $NC_TAG already exists on remote"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag $NC_TAG does not exist"
          fi
          echo "nc_tag=$NC_TAG" >> $GITHUB_OUTPUT

      - name: Check for Changes
        id: changes
        run: |
          LOCAL=$(git rev-parse HEAD)
          UPSTREAM=$(git rev-parse upstream/main)
          
          if [ "$LOCAL" != "$UPSTREAM" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Upstream has new commits. Local: $LOCAL, Upstream: $UPSTREAM"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Already up to date"
          fi

      - name: Sync and Push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git merge upstream/main --no-edit -m "chore: sync from upstream [skip ci]"
          git push origin main

      - name: Create -nc Tag
        if: steps.changes.outputs.changed == 'true' && steps.upstream_tag.outputs.latest_tag != '' && steps.nc_tag_check.outputs.exists == 'false'
        run: |
          NC_TAG="${{ steps.nc_tag_check.outputs.nc_tag }}"
          git tag "$NC_TAG"
          git push origin "$NC_TAG"
          echo "Created and pushed new tag: $NC_TAG"

      - name: Force update -nc Tag (new commits on same upstream tag)
        if: steps.changes.outputs.changed == 'true' && steps.upstream_tag.outputs.latest_tag != '' && steps.nc_tag_check.outputs.exists == 'true'
        run: |
          NC_TAG="${{ steps.nc_tag_check.outputs.nc_tag }}"
          # Create an empty commit to force tag update
          git commit --allow-empty -m "chore: rebuild for ${{ steps.upstream_tag.outputs.latest_tag }}-nc [skip ci]"
          git tag -f "$NC_TAG"
          git push origin "$NC_TAG" --force
          echo "Force updated tag: $NC_TAG with new commit"